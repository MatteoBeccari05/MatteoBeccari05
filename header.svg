<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-label="Matteo Beccari - Database, Socket, Backend Developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f2027">
        <animate attributeName="stop-color" values="#0f2027;#1b1464;#0f2027" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#203a43">
        <animate attributeName="stop-color" values="#203a43;#2c5364;#203a43" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#2c5364">
        <animate attributeName="stop-color" values="#2c5364;#0f2027;#2c5364" dur="10s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="shine" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="360" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#36bcf7"/>
      <stop offset="0.5" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#a78bfa"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-360 0;720 0" dur="5s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#36bcf7" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#36bcf7"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="round">
      <rect width="1000" height="300" rx="22"/>
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
    <!-- Sfondo -->
    <rect width="1000" height="300" fill="url(#bg)"/>

    <!-- Stelle che lampeggiano -->
    <g fill="#ffffff">
      <circle cx="60" cy="40" r="1.6"><animate attributeName="opacity" values="0.1;1;0.1" dur="2.4s" repeatCount="indefinite"/></circle>
      <circle cx="140" cy="95" r="1.2"><animate attributeName="opacity" values="0.1;1;0.1" dur="3.1s" begin="0.5s" repeatCount="indefinite"/></circle>
      <circle cx="220" cy="30" r="1.8"><animate attributeName="opacity" values="0.1;1;0.1" dur="2.8s" begin="1s" repeatCount="indefinite"/></circle>
      <circle cx="330" cy="70" r="1.2"><animate attributeName="opacity" values="0.1;1;0.1" dur="3.5s" begin="0.2s" repeatCount="indefinite"/></circle>
      <circle cx="430" cy="28" r="1.5"><animate attributeName="opacity" values="0.1;1;0.1" dur="2.2s" begin="1.4s" repeatCount="indefinite"/></circle>
      <circle cx="560" cy="48" r="1.3"><animate attributeName="opacity" values="0.1;1;0.1" dur="3.2s" begin="0.8s" repeatCount="indefinite"/></circle>
      <circle cx="660" cy="26" r="1.7"><animate attributeName="opacity" values="0.1;1;0.1" dur="2.6s" begin="0.3s" repeatCount="indefinite"/></circle>
      <circle cx="760" cy="82" r="1.2"><animate attributeName="opacity" values="0.1;1;0.1" dur="3.4s" begin="1.1s" repeatCount="indefinite"/></circle>
      <circle cx="850" cy="36" r="1.9"><animate attributeName="opacity" values="0.1;1;0.1" dur="2.5s" begin="0.6s" repeatCount="indefinite"/></circle>
      <circle cx="940" cy="90" r="1.3"><animate attributeName="opacity" values="0.1;1;0.1" dur="3s" begin="1.7s" repeatCount="indefinite"/></circle>
      <circle cx="905" cy="150" r="1.1"><animate attributeName="opacity" values="0.1;1;0.1" dur="2.9s" begin="0.9s" repeatCount="indefinite"/></circle>
      <circle cx="95" cy="160" r="1.1"><animate attributeName="opacity" values="0.1;1;0.1" dur="3.3s" begin="1.3s" repeatCount="indefinite"/></circle>
    </g>

    <!-- Simboli di codice che salgono -->
    <g font-family="Consolas, 'Fira Code', 'Courier New', monospace" font-size="16" fill="#36bcf7" text-anchor="middle">
      <text x="90" y="270" opacity="0">SELECT *
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -200" dur="7s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.55;0" dur="7s" repeatCount="indefinite"/>
      </text>
      <text x="230" y="270" opacity="0">{ }
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -200" dur="6s" begin="1.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.55;0" dur="6s" begin="1.5s" repeatCount="indefinite"/>
      </text>
      <text x="350" y="270" opacity="0">socket()
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -200" dur="8s" begin="0.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.55;0" dur="8s" begin="0.5s" repeatCount="indefinite"/>
      </text>
      <text x="640" y="270" opacity="0">JOIN
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -200" dur="7s" begin="2.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.55;0" dur="7s" begin="2.5s" repeatCount="indefinite"/>
      </text>
      <text x="760" y="270" opacity="0">&lt;?php
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -200" dur="6.5s" begin="1s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.55;0" dur="6.5s" begin="1s" repeatCount="indefinite"/>
      </text>
      <text x="890" y="270" opacity="0">01101
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -200" dur="8s" begin="3s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.55;0" dur="8s" begin="3s" repeatCount="indefinite"/>
      </text>
    </g>

    <!-- Onde animate -->
    <path fill="#36bcf7" fill-opacity="0.18" d="M0 240 Q125 210 250 240 T500 240 T750 240 T1000 240 T1250 240 T1500 240 T1750 240 T2000 240 V300 H0 Z">
      <animateTransform attributeName="transform" type="translate" values="0 0;-1000 0" dur="12s" repeatCount="indefinite"/>
    </path>
    <path fill="#a78bfa" fill-opacity="0.16" d="M0 255 Q125 235 250 255 T500 255 T750 255 T1000 255 T1250 255 T1500 255 T1750 255 T2000 255 V300 H0 Z">
      <animateTransform attributeName="transform" type="translate" values="-1000 0;0 0" dur="9s" repeatCount="indefinite"/>
    </path>
    <path fill="#0f2027" fill-opacity="0.55" d="M0 270 Q125 255 250 270 T500 270 T750 270 T1000 270 T1250 270 T1500 270 T1750 270 T2000 270 V300 H0 Z">
      <animateTransform attributeName="transform" type="translate" values="0 0;-1000 0" dur="6s" repeatCount="indefinite"/>
    </path>

    <!-- Nome con riflesso che scorre -->
    <text x="500" y="145" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="68" font-weight="800" fill="url(#shine)" filter="url(#glow)" opacity="0">
      Matteo Beccari
      <animate attributeName="opacity" values="0;1" dur="1.2s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" values="0 18;0 0" dur="1.2s" fill="freeze"/>
    </text>

    <!-- Linea che pulsa -->
    <rect x="300" y="170" width="400" height="3" rx="1.5" fill="url(#line)">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite"/>
    </rect>

    <!-- Sottotitolo -->
    <text x="500" y="212" text-anchor="middle" font-family="Consolas, 'Fira Code', 'Courier New', monospace" font-size="22" letter-spacing="4" fill="#cfe9f5" opacity="0">
      Database  ·  Socket  ·  Backend Developer
      <animate attributeName="opacity" values="0;1" dur="1.4s" begin="0.8s" fill="freeze"/>
    </text>
  </g>

  <!-- Bordo -->
  <rect x="1" y="1" width="998" height="298" rx="21" fill="none" stroke="#36bcf7" stroke-opacity="0.35" stroke-width="2"/>
</svg>
